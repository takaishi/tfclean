name: goreleaser test

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/goreleaser_test.yml"
      - ".github/workflows/goreleaser.yml"

permissions:
  contents: write

jobs:
  goreleaser_test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          repositories: |
            tfclean
            homebrew-tap
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.11.0
          args: release --clean --skip publish --snapshot
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
      - name: Debug GoReleaser build info
        run: |
          echo "Git commit: $(git rev-parse --short HEAD)"
          echo "Git tag: $(git describe --tags --exact-match 2>/dev/null || echo 'no tag')"
          echo "Checking if ldflags were applied..."
          if [ -f dist/config.yaml ]; then
            echo "GoReleaser config:"
            cat dist/config.yaml | head -20
          fi
